<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 여백 / 자르기 편집기</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, "Noto Sans KR", sans-serif;
            background: #f5f6f8;
            color: #222;
        }
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        #imageSelect {
            min-width: 220px;
            height: 40px;
            padding: 0 10px;
            border: 1px solid #ccd1d8;
            border-radius: 8px;
            background: #fff;
        }
        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 16px;
            font-size: 14px;
            cursor: pointer;
            background: #222;
            color: #fff;
        }
        button.secondary {
            background: #e8eaed;
            color: #222;
        }
        button:disabled {
            opacity: .45;
            cursor: default;
        }
        .info {
            margin-bottom: 14px;
            color: #666;
            font-size: 14px;
        }
        .preview-wrap {
            min-height: 500px;
            border: 1px solid #d8dce2;
            border-radius: 12px;
            background:
                linear-gradient(45deg, #eee 25%, transparent 25%),
                linear-gradient(-45deg, #eee 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #eee 75%),
                linear-gradient(-45deg, transparent 75%, #eee 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            padding: 20px;
        }
        .preview-wrap.drag {
            border: 2px dashed #222;
            background-color: #eef0f3;
        }
        canvas {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            box-shadow: 0 4px 20px rgba(0,0,0,.12);
        }
        .empty {
            color: #888;
            text-align: center;
            line-height: 1.7;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }
        .modal-backdrop.show { display: flex; }
        .modal {
            width: min(520px, 100%);
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            overflow: hidden;
        }
        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-header h2 {
            margin: 0;
            font-size: 18px;
        }
        .close {
            border: 0;
            background: transparent;
            color: #555;
            font-size: 24px;
            padding: 0;
        }
        .modal-body { padding: 20px; }
        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        input[type="file"] { display: none; }

        .guide {
            padding: 12px 14px;
            background: #f5f6f8;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 18px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: bold;
        }
        .field input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #ccd1d8;
            border-radius: 8px;
            font-size: 15px;
        }
        .summary {
            margin-top: 18px;
            padding: 12px 14px;
            border: 1px solid #e0e3e8;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.7;
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .preview-wrap { min-height: 350px; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>이미지 여백 / 자르기 편집기</h1>
    <div class="info">
        양수(+): 해당 방향으로 투명 여백 추가 / 음수(-): 해당 방향을 잘라냅니다.
    </div>

    <div class="toolbar">
        <button type="button" id="openUploadBtn">이미지 넣기</button>
        <select id="imageSelect" hidden></select>
        <button type="button" id="openEditBtn" class="secondary" disabled>상하좌우 편집</button>
        <button type="button" id="resetBtn" class="secondary" disabled>원본으로 초기화</button>
        <button type="button" id="saveBtn" disabled>현재 이미지 저장</button>
        <button type="button" id="saveAllBtn" disabled>전체 저장</button>
    </div>

    <div id="sizeInfo" class="info">이미지를 선택해주세요.</div>

    <div class="preview-wrap" id="previewWrap">
        <div id="emptyText" class="empty">
            아직 이미지가 없습니다.<br>
            '이미지 넣기'를 눌러 이미지를 선택해주세요.
        </div>
        <canvas id="canvas" hidden></canvas>
    </div>
</div>

<input id="fileInput" type="file" accept="image/*" multiple>

<!-- 편집값 모달 -->
<div id="editModal" class="modal-backdrop">
    <div class="modal">
        <div class="modal-header">
            <h2>상하좌우 편집</h2>
            <button type="button" class="close" data-close="editModal">&times;</button>
        </div>
        <div class="modal-body">
            <div class="guide">
                예) 위쪽에 100px 추가 → <b>위 +100</b><br>
                왼쪽을 30px 자르기 → <b>왼쪽 -30</b>
            </div>

            <div class="grid">
                <div class="field">
                    <label for="topValue">위 (px)</label>
                    <input id="topValue" type="number" value="0" step="1">
                </div>
                <div class="field">
                    <label for="bottomValue">아래 (px)</label>
                    <input id="bottomValue" type="number" value="0" step="1">
                </div>
                <div class="field">
                    <label for="leftValue">왼쪽 (px)</label>
                    <input id="leftValue" type="number" value="0" step="1">
                </div>
                <div class="field">
                    <label for="rightValue">오른쪽 (px)</label>
                    <input id="rightValue" type="number" value="0" step="1">
                </div>
            </div>

            <div id="editSummary" class="summary"></div>
        </div>
        <div class="modal-footer">
            <button type="button" class="secondary" data-close="editModal">취소</button>
            <button type="button" id="applyBtn">적용</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'imageCropPaddingValues';
    const defaultValues = { top: 0, bottom: 0, left: 0, right: 0 };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const emptyText = document.getElementById('emptyText');
    const sizeInfo = document.getElementById('sizeInfo');
    const fileInput = document.getElementById('fileInput');
    const previewWrap = document.getElementById('previewWrap');
    const imageSelect = document.getElementById('imageSelect');

    const openUploadBtn = document.getElementById('openUploadBtn');
    const openEditBtn = document.getElementById('openEditBtn');
    const resetBtn = document.getElementById('resetBtn');
    const saveBtn = document.getElementById('saveBtn');
    const saveAllBtn = document.getElementById('saveAllBtn');
    const applyBtn = document.getElementById('applyBtn');

    const topInput = document.getElementById('topValue');
    const bottomInput = document.getElementById('bottomValue');
    const leftInput = document.getElementById('leftValue');
    const rightInput = document.getElementById('rightValue');
    const editSummary = document.getElementById('editSummary');

    let imageItems = [];
    let currentIndex = 0;
    let values = loadSavedValues();

    function loadSavedValues() {
        try {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if (!saved) return { ...defaultValues };

            return {
                top: Number(saved.top) || 0,
                bottom: Number(saved.bottom) || 0,
                left: Number(saved.left) || 0,
                right: Number(saved.right) || 0
            };
        } catch {
            return { ...defaultValues };
        }
    }

    function saveValues() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(values));
    }

    function getCurrentItem() {
        return imageItems[currentIndex] || null;
    }

    function openModal(id) {
        document.getElementById(id).classList.add('show');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('show');
    }

    document.querySelectorAll('[data-close]').forEach(btn => {
        btn.addEventListener('click', () => closeModal(btn.dataset.close));
    });

    document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
        backdrop.addEventListener('click', e => {
            if (e.target === backdrop) closeModal(backdrop.id);
        });
    });

    openUploadBtn.addEventListener('click', () => fileInput.click());

    openEditBtn.addEventListener('click', () => {
        topInput.value = values.top;
        bottomInput.value = values.bottom;
        leftInput.value = values.left;
        rightInput.value = values.right;
        updateEditSummary();
        openModal('editModal');
    });

    [topInput, bottomInput, leftInput, rightInput].forEach(input => {
        input.addEventListener('input', updateEditSummary);
    });

    function getInputValues() {
        return {
            top: parseInt(topInput.value || 0, 10),
            bottom: parseInt(bottomInput.value || 0, 10),
            left: parseInt(leftInput.value || 0, 10),
            right: parseInt(rightInput.value || 0, 10)
        };
    }

    function getMetrics(img, v) {
        const cropLeft = Math.max(-v.left, 0);
        const cropRight = Math.max(-v.right, 0);
        const cropTop = Math.max(-v.top, 0);
        const cropBottom = Math.max(-v.bottom, 0);

        const addLeft = Math.max(v.left, 0);
        const addRight = Math.max(v.right, 0);
        const addTop = Math.max(v.top, 0);
        const addBottom = Math.max(v.bottom, 0);

        const sourceWidth = img.naturalWidth - cropLeft - cropRight;
        const sourceHeight = img.naturalHeight - cropTop - cropBottom;

        if (sourceWidth <= 0 || sourceHeight <= 0) return null;

        return {
            cropLeft,
            cropTop,
            addLeft,
            addTop,
            sourceWidth,
            sourceHeight,
            resultWidth: sourceWidth + addLeft + addRight,
            resultHeight: sourceHeight + addTop + addBottom
        };
    }

    function updateEditSummary() {
        const item = getCurrentItem();
        if (!item) return;

        const v = getInputValues();
        const metrics = getMetrics(item.image, v);

        if (!metrics) {
            editSummary.innerHTML = '<b>현재 값으로는 이미지를 만들 수 없습니다.</b>';
            return;
        }

        editSummary.innerHTML =
            `원본: <b>${item.image.naturalWidth} × ${item.image.naturalHeight}px</b><br>` +
            `결과: <b>${metrics.resultWidth} × ${metrics.resultHeight}px</b><br>` +
            `이 값은 모든 이미지에 동일하게 적용됩니다.`;
    }

    function readImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();

            reader.onload = e => {
                const img = new Image();

                img.onload = () => resolve({
                    image: img,
                    fileName: file.name,
                    outputName: file.name.replace(/\.[^.]+$/, '') + '.png'
                });

                img.onerror = reject;
                img.src = e.target.result;
            };

            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    async function loadFiles(fileList) {
        const files = Array.from(fileList).filter(file => file.type.startsWith('image/'));

        if (!files.length) {
            alert('이미지 파일을 선택해주세요.');
            return;
        }

        try {
            imageItems = await Promise.all(files.map(readImage));
            currentIndex = 0;

            updateImageSelect();

            openEditBtn.disabled = false;
            resetBtn.disabled = false;
            saveBtn.disabled = false;
            saveAllBtn.disabled = false;

            render();
        } catch {
            alert('이미지를 불러오는 중 오류가 발생했습니다.');
        }
    }

    function updateImageSelect() {
        imageSelect.innerHTML = '';

        imageItems.forEach((item, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = `${index + 1}. ${item.fileName}`;
            imageSelect.appendChild(option);
        });

        imageSelect.hidden = imageItems.length <= 1;
        imageSelect.value = currentIndex;
    }

    imageSelect.addEventListener('change', () => {
        currentIndex = Number(imageSelect.value);
        render();
    });

    fileInput.addEventListener('change', () => {
        loadFiles(fileInput.files);
        fileInput.value = '';
    });

    ['dragenter', 'dragover'].forEach(eventName => {
        previewWrap.addEventListener(eventName, e => {
            e.preventDefault();
            e.stopPropagation();
            previewWrap.classList.add('drag');
        });
    });

    ['dragleave', 'drop'].forEach(eventName => {
        previewWrap.addEventListener(eventName, e => {
            e.preventDefault();
            e.stopPropagation();
            previewWrap.classList.remove('drag');
        });
    });

    previewWrap.addEventListener('drop', e => {
        loadFiles(e.dataTransfer.files);
    });

    applyBtn.addEventListener('click', () => {
        const newValues = getInputValues();

        const invalidItem = imageItems.find(item => !getMetrics(item.image, newValues));

        if (invalidItem) {
            alert(`"${invalidItem.fileName}" 이미지에 적용할 수 없는 값입니다.`);
            return;
        }

        values = newValues;
        saveValues();
        render();
        closeModal('editModal');
    });

    resetBtn.addEventListener('click', () => {
        if (!imageItems.length) return;

        values = { ...defaultValues };
        saveValues();
        render();
    });

    function drawImage(targetCanvas, img, v) {
        const metrics = getMetrics(img, v);
        if (!metrics) return null;

        targetCanvas.width = metrics.resultWidth;
        targetCanvas.height = metrics.resultHeight;

        const targetCtx = targetCanvas.getContext('2d');
        targetCtx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);

        targetCtx.drawImage(
            img,
            metrics.cropLeft,
            metrics.cropTop,
            metrics.sourceWidth,
            metrics.sourceHeight,
            metrics.addLeft,
            metrics.addTop,
            metrics.sourceWidth,
            metrics.sourceHeight
        );

        return metrics;
    }

    function render() {
        const item = getCurrentItem();
        if (!item) return;

        const metrics = drawImage(canvas, item.image, values);

        if (!metrics) {
            canvas.hidden = true;
            emptyText.hidden = false;
            emptyText.textContent = '현재 편집값을 이 이미지에 적용할 수 없습니다.';
            return;
        }

        canvas.hidden = false;
        emptyText.hidden = true;

        sizeInfo.textContent =
            `${currentIndex + 1} / ${imageItems.length} · ${item.fileName} · ` +
            `원본 ${item.image.naturalWidth} × ${item.image.naturalHeight}px → ` +
            `결과 ${metrics.resultWidth} × ${metrics.resultHeight}px`;
    }

    function downloadBlob(blob, fileName) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');

        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function canvasToBlob(targetCanvas) {
        return new Promise(resolve => targetCanvas.toBlob(resolve, 'image/png'));
    }

    saveBtn.addEventListener('click', async () => {
        const item = getCurrentItem();
        if (!item) return;

        const resultCanvas = document.createElement('canvas');

        if (!drawImage(resultCanvas, item.image, values)) return;

        const blob = await canvasToBlob(resultCanvas);
        if (blob) downloadBlob(blob, item.outputName);
    });

    saveAllBtn.addEventListener('click', async () => {
        if (!imageItems.length) return;

        for (const item of imageItems) {
            const resultCanvas = document.createElement('canvas');

            if (!drawImage(resultCanvas, item.image, values)) continue;

            const blob = await canvasToBlob(resultCanvas);

            if (blob) {
                downloadBlob(blob, item.outputName);
                await new Promise(resolve => setTimeout(resolve, 150));
            }
        }
    });

    window.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            document.querySelectorAll('.modal-backdrop.show').forEach(modal => {
                closeModal(modal.id);
            });
        }
    });
</script>
</body>
</html>
