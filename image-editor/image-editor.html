<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이미지 여백 / 자르기 편집기</title>

    <style>
        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: Arial, "Noto Sans KR", sans-serif;
            background: #eef1f5;
            color: #222;
        }

        button, input, select {
            font: inherit;
        }

        button {
            min-height: 40px;
            border: 0;
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 14px;
            cursor: pointer;
            background: #222;
            color: #fff;
        }

        button.secondary {
            background: #e8eaed;
            color: #222;
        }

        button:disabled {
            opacity: .45;
            cursor: default;
        }

        input[type="file"] {
            display: none;
        }

        .container {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 340px minmax(0, 1fr);
            overflow: hidden;
        }

        .sidebar {
            min-width: 0;
            height: 100%;
            overflow-y: auto;
            padding: 18px;
            background: #fff;
            border-right: 1px solid #d8dce2;
        }

        .sidebar h1 {
            margin: 0 0 8px;
            font-size: 22px;
            line-height: 1.25;
        }

        .info {
            color: #666;
            font-size: 13px;
            line-height: 1.55;
        }

        #sizeInfo {
            margin-top: 12px;
            padding: 10px 12px;
            border: 1px solid #e0e3e8;
            border-radius: 8px;
            background: #f7f8fa;
            word-break: break-word;
        }

        .toolbar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 14px;
        }

        .toolbar > #openUploadBtn,
        .toolbar > #imageSelect,
        .toolbar > .wand-row,
        .toolbar > .save-row,
        .toolbar > .zoom-toolbar {
            grid-column: 1 / -1;
        }

        #imageSelect {
            width: 100%;
            height: 40px;
            padding: 0 10px;
            border: 1px solid #ccd1d8;
            border-radius: 8px;
            background: #fff;
        }

        .wand-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 9px;
            margin-top: 4px;
            padding: 12px;
            border: 1px solid #e0e3e8;
            border-radius: 10px;
            background: #f8f9fb;
        }

        .wand-control,
        .preview-bg-control {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .wand-control > span:first-child,
        .preview-bg-control > span:first-child {
            font-size: 13px;
            color: #555;
        }

        .wand-control input[type="number"] {
            width: 92px;
            height: 38px;
            padding: 0 10px;
            border: 1px solid #ccd1d8;
            border-radius: 8px;
            font-size: 14px;
        }

        .wand-control input[type="color"],
        .preview-bg-control input[type="color"] {
            width: 42px;
            height: 38px;
            padding: 3px;
            border: 1px solid #ccd1d8;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            flex: 0 0 auto;
        }

        .wand-control input[type="text"] {
            flex: 1;
            min-width: 0;
            height: 38px;
            padding: 0 9px;
            border: 1px solid #ccd1d8;
            border-radius: 8px;
            font-size: 14px;
            text-transform: uppercase;
        }

        #wandBtn.active {
            background: #0f62fe;
            color: #fff;
        }

        #wandStatus {
            font-size: 12px;
            line-height: 1.45;
            color: #666;
        }

        .favorite-colors {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
        }

        .favorite-color-btn {
            width: 100%;
            aspect-ratio: 1;
            min-width: 0;
            min-height: 0;
            padding: 0;
            border-radius: 6px;
            border: 1px solid #c9ced6;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.55);
        }

        .save-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding-top: 2px;
        }

        .save-row .preview-bg-control {
            grid-column: 1 / -1;
        }

        .zoom-toolbar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 4px;
            padding: 10px;
            border: 1px solid #e0e3e8;
            border-radius: 10px;
            background: #f8f9fb;
        }

        .zoom-toolbar button {
            min-width: 0;
            padding-left: 6px;
            padding-right: 6px;
        }

        .zoom-label {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }

        .workspace {
            position: relative;
            min-width: 0;
            min-height: 0;
            height: 100%;
            overflow: hidden;
        }

        .preview-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 0;
            overflow: auto;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            background-image:
                    linear-gradient(45deg, #ddd 25%, transparent 25%),
                    linear-gradient(-45deg, #ddd 25%, transparent 25%),
                    linear-gradient(45deg, transparent 75%, #ddd 75%),
                    linear-gradient(-45deg, transparent 75%, #ddd 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0;
        }

        .preview-wrap.drag {
            outline: 2px dashed #222;
            outline-offset: -6px;
        }

        #canvasStage {
            position: relative;
            flex: 0 0 auto;
            margin: auto;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            object-fit: contain;
            box-shadow: 0 4px 20px rgba(0,0,0,.18);
            touch-action: none;
        }

        .empty {
            color: #777;
            text-align: center;
            line-height: 1.7;
            padding: 24px;
        }

        .preview-nav {
            position: fixed;
            top: 50%;
            width: 44px;
            height: 56px;
            min-height: 0;
            padding: 0;
            border-radius: 10px;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            font-size: 28px;
            background: rgba(34,34,34,.74);
            color: #fff;
            user-select: none;
        }

        .preview-nav-left {
            left: 352px;
        }

        .preview-nav-right {
            right: 12px;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,.45);
        }

        .modal-backdrop.show {
            display: flex;
        }

        .modal {
            width: min(520px, 100%);
            max-height: calc(100vh - 40px);
            overflow: auto;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
        }

        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .close {
            min-height: 0;
            padding: 0;
            background: transparent;
            color: #555;
            font-size: 24px;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .guide {
            padding: 12px 14px;
            margin-bottom: 18px;
            border-radius: 8px;
            background: #f5f6f8;
            font-size: 13px;
            line-height: 1.6;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        .field input,
        .field select {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #ccd1d8;
            border-radius: 8px;
            background: #fff;
            font-size: 15px;
        }

        .summary {
            margin-top: 18px;
            padding: 12px 14px;
            border: 1px solid #e0e3e8;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.7;
        }

        @media (max-width: 900px) {
            html, body {
                overflow: auto;
            }

            .container {
                height: auto;
                min-height: 100%;
                grid-template-columns: 1fr;
                grid-template-rows: auto 65vh;
            }

            .sidebar {
                height: auto;
                max-height: none;
                border-right: 0;
                border-bottom: 1px solid #d8dce2;
            }

            .workspace {
                height: 65vh;
            }

            .preview-nav {
                position: absolute;
            }

            .preview-nav-left {
                left: 12px;
            }

            .toolbar {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 560px) {
            .toolbar,
            .save-row {
                grid-template-columns: 1fr;
            }

            .save-row .preview-bg-control {
                grid-column: auto;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .favorite-colors {
                grid-template-columns: repeat(5, 1fr);
            }
        }
    </style>

</head>
<body>
<div class="container">
    <aside class="sidebar">
        <h1>이미지 여백 / 자르기 편집기</h1>
        <div class="info">
            양수(+): 해당 방향으로 투명 여백 추가 / 음수(-): 해당 방향을 잘라냅니다.
        </div>

        <div class="toolbar">
            <button type="button" id="openUploadBtn">이미지 넣기</button>
            <select id="imageSelect" hidden></select>
            <button type="button" id="openEditBtn" class="secondary" title="단축키: Ctrl + Q" disabled>Q) 상하좌우 편집</button>
            <button type="button" id="openResizeBtn" class="secondary" title="단축키: Ctrl + W" disabled>W) 크기 조정</button>
            <button type="button" id="openTextBtn" class="secondary" title="단축키: Ctrl + A" disabled>A) 텍스트 추가</button>
            <button type="button" id="resetBtn" class="secondary" title="단축키: Ctrl + S" disabled>S) 원본으로 초기화</button>
            <button type="button" id="removeAllBgBtn" class="secondary" title="단축키: Ctrl + Z" disabled>Z) 전체 배경 제거</button>
            <button type="button" id="wandBtn" class="secondary" title="단축키: Ctrl + X" disabled>X) 마법봉</button>

            <div class="wand-row">
                <label class="wand-control">
                    <span>허용</span>
                    <input type="number" id="wandTolerance" min="0" max="255" step="1" value="20">
                    <input type="color" id="wandColor" value="#da312b">
                    <input type="text" id="wandHex" value="#DA312B" maxlength="7"
                           placeholder="#DA312B" spellcheck="false" aria-label="HEX 색상 코드">
                </label>

                <button type="button" id="applyWandColorBtn" disabled>선택 영역 색상 변경</button>
                <div id="favoriteColors" class="favorite-colors"></div>
                <span id="wandStatus">마법봉을 켠 뒤 이미지를 클릭하세요. Shift/Ctrl + 클릭은 영역 추가입니다.</span>
            </div>

            <div class="save-row">
                <div class="preview-bg-control">
                    <span>확인 배경</span>
                    <input type="color" id="previewBgColor" value="#000000">
                    <button type="button" id="checkerBgBtn" class="secondary">체크무늬</button>
                </div>

                <button type="button" id="saveBtn" title="단축키: S" disabled>현재 이미지 저장</button>
                <button type="button" id="saveAllBtn" title="단축키: Shift + S" disabled>전체 저장</button>
            </div>
        </div>

        <div class="zoom-toolbar">
            <button type="button" id="zoomOutBtn" class="secondary">축소</button>
            <button type="button" id="zoomInBtn" class="secondary">확대</button>
            <button type="button" id="zoomResetBtn" class="secondary">100%</button>
            <button type="button" id="zoomFitBtn" class="secondary">화면맞춤</button>
            <span id="zoomLabel" class="zoom-label">100%</span>
        </div>

        <div id="sizeInfo" class="info">이미지를 선택해주세요.</div>
    </aside>

    <main class="workspace">

        <div class="preview-wrap" id="previewWrap">
            <button type="button" id="prevImageBtn" class="preview-nav preview-nav-left" hidden aria-label="이전 이미지">‹</button>
            <button type="button" id="nextImageBtn" class="preview-nav preview-nav-right" hidden aria-label="다음 이미지">›</button>
            <div id="emptyText" class="empty">
                아직 이미지가 없습니다.<br>
                '이미지 넣기'를 눌러 이미지를 선택해주세요.
            </div>
            <div id="canvasStage" hidden>
                <canvas id="canvas" hidden></canvas>
            </div>
        </div>
    </main>
</div>

<input id="fileInput" type="file" accept="image/*" multiple>

<!-- 편집값 모달 -->
<div id="editModal" class="modal-backdrop">
    <div class="modal">
        <div class="modal-header">
            <h2>상하좌우 편집</h2>
            <button type="button" class="close" data-close="editModal">&times;</button>
        </div>
        <div class="modal-body">
            <div class="guide">
                예) 위쪽에 100px 추가 → <b>위 +100</b><br>
                왼쪽을 30px 자르기 → <b>왼쪽 -30</b>
            </div>

            <div class="grid">
                <div class="field">
                    <label for="topValue">위 (px)</label>
                    <input id="topValue" type="number" value="0" step="1">
                </div>
                <div class="field">
                    <label for="bottomValue">아래 (px)</label>
                    <input id="bottomValue" type="number" value="0" step="1">
                </div>
                <div class="field">
                    <label for="leftValue">왼쪽 (px)</label>
                    <input id="leftValue" type="number" value="0" step="1">
                </div>
                <div class="field">
                    <label for="rightValue">오른쪽 (px)</label>
                    <input id="rightValue" type="number" value="0" step="1">
                </div>
            </div>

            <div id="editSummary" class="summary"></div>
        </div>
        <div class="modal-footer">
            <button type="button" class="secondary" data-close="editModal">취소</button>
            <button type="button" id="applyBtn">적용</button>
        </div>
    </div>
</div>

<!-- 이미지 크기 조정 모달 -->
<div id="resizeModal" class="modal-backdrop">
    <div class="modal">
        <div class="modal-header">
            <h2>이미지 크기 조정</h2>
            <button type="button" class="close" data-close="resizeModal">&times;</button>
        </div>

        <div class="modal-body">
            <div class="guide">
                이미지 모양은 그대로 유지하면서 실제 픽셀 크기만 변경합니다.
            </div>

            <div class="grid">
                <div class="field">
                    <label for="resizeWidth">너비 (px)</label>
                    <input id="resizeWidth" type="number" min="1" step="1">
                </div>

                <div class="field">
                    <label for="resizeHeight">높이 (px)</label>
                    <input id="resizeHeight" type="number" min="1" step="1">
                </div>
            </div>

             <div id="resizeSummary" class="summary"></div>
        </div>

        <div class="modal-footer">
            <button type="button" class="secondary" data-close="resizeModal">취소</button>
            <button type="button" id="applyResizeBtn">적용</button>
        </div>
    </div>
</div>

<div id="textModal" class="modal-backdrop">
    <div class="modal">
        <div class="modal-header">
            <h2 id="textModalTitle">텍스트 추가</h2>
            <button type="button" class="close" data-close="textModal">&times;</button>
        </div>

        <div class="modal-body">
            <div class="field" style="margin-bottom:14px;">
                <label for="textValue">텍스트</label>
                <input id="textValue" type="text" placeholder="텍스트를 입력하세요">
            </div>

            <div class="grid">
                <div class="field">
                    <label for="fontSize">글자 크기 (px)</label>
                    <input id="fontSize" type="number" value="50" min="1">
                </div>

                <div class="field">
                    <label for="outlineWidth">테두리 두께 (px)</label>
                    <input id="outlineWidth" type="number" value="3" min="0" step="0.5">
                </div>

                <div class="field">
                    <label for="textColor">글자 색</label>
                    <input id="textColor" type="color" value="#ffffff">
                </div>

                <div class="field">
                    <label for="outlineColor">테두리 색</label>
                    <input id="outlineColor" type="color" value="#000000">
                </div>

                <div class="field">
                    <label for="textX">X 위치</label>
                    <input id="textX" type="number" value="50">
                </div>

                <div class="field">
                    <label for="textY">Y 위치</label>
                    <input id="textY" type="number" value="50">
                </div>
            </div>

            <div class="field" style="margin-top:14px;">
                <label for="fontSelect">글꼴</label>

                <div style="display:flex; gap:8px;">
                    <select id="fontSelect" style="flex:1;">
                        <option value="Arial">Arial</option>
                    </select>

                    <button type="button" id="loadLocalFontsBtn" class="secondary">
                        불러오기
                    </button>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button type="button" id="removeTextBtn" class="secondary">텍스트 제거</button>
            <button type="button" class="secondary" data-close="textModal">취소</button>
            <button type="button" id="applyTextBtn">적용</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'imageCropPaddingValues';
    const defaultValues = { top: 0, bottom: 0, left: 0, right: 0 };

    const canvas = document.getElementById('canvas');
    const canvasStage = document.getElementById('canvasStage');
    const ctx = canvas.getContext('2d');
    const emptyText = document.getElementById('emptyText');
    const sizeInfo = document.getElementById('sizeInfo');
    const fileInput = document.getElementById('fileInput');
    const previewWrap = document.getElementById('previewWrap');
    const previewBgColor = document.getElementById('previewBgColor');
    const checkerBgBtn = document.getElementById('checkerBgBtn');
    const imageSelect = document.getElementById('imageSelect');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomResetBtn = document.getElementById('zoomResetBtn');
    const zoomFitBtn = document.getElementById('zoomFitBtn');
    const zoomLabel = document.getElementById('zoomLabel');

    const openUploadBtn = document.getElementById('openUploadBtn');
    const openEditBtn = document.getElementById('openEditBtn');
    const openResizeBtn = document.getElementById('openResizeBtn');
    const resizeWidth = document.getElementById('resizeWidth');
    const resizeHeight = document.getElementById('resizeHeight');
    const resizeSummary = document.getElementById('resizeSummary');
    const applyResizeBtn = document.getElementById('applyResizeBtn');
    let resizeMode = 'width';

    const resetBtn = document.getElementById('resetBtn');
    const saveBtn = document.getElementById('saveBtn');
    const saveAllBtn = document.getElementById('saveAllBtn');
    const removeAllBgBtn = document.getElementById('removeAllBgBtn');
    const applyBtn = document.getElementById('applyBtn');

    const wandBtn = document.getElementById('wandBtn');
    const wandTolerance = document.getElementById('wandTolerance');
    const wandColor = document.getElementById('wandColor');
    const wandHex = document.getElementById('wandHex');
    const applyWandColorBtn = document.getElementById('applyWandColorBtn');
    const favoriteColors = document.getElementById('favoriteColors');
    const wandStatus = document.getElementById('wandStatus');
    const prevImageBtn = document.getElementById('prevImageBtn');
    const nextImageBtn = document.getElementById('nextImageBtn');

    const topInput = document.getElementById('topValue');
    const bottomInput = document.getElementById('bottomValue');
    const leftInput = document.getElementById('leftValue');
    const rightInput = document.getElementById('rightValue');
    const editSummary = document.getElementById('editSummary');

    const openTextBtn = document.getElementById('openTextBtn');
    const applyTextBtn = document.getElementById('applyTextBtn');
    const removeTextBtn = document.getElementById('removeTextBtn');

    const textValue = document.getElementById('textValue');
    const fontSize = document.getElementById('fontSize');
    const outlineWidth = document.getElementById('outlineWidth');
    const textColor = document.getElementById('textColor');
    const outlineColor = document.getElementById('outlineColor');
    const textX = document.getElementById('textX');
    const textY = document.getElementById('textY');

    const fontSelect = document.getElementById('fontSelect');
    const loadLocalFontsBtn = document.getElementById('loadLocalFontsBtn');

    let localFonts = [];
    const loadedFontFaces = new Map();

    const textModalTitle = document.getElementById('textModalTitle');

    const defaultTextSettings = {
        enabled: false,
        text: '',
        fontSize: 50,
        fontFamily: 'Arial',
        fontOption: 'Arial',
        color: '#000000',
        outlineColor: '#ffffff',
        outlineWidth: 1,
        x: 50,
        y: 10
    };

    let textSettings = { ...defaultTextSettings };

    let textSelected = false;
    let draggingText = false;
    let dragAxis = null;

    let wandMode = false;
    let wandSelection = null;
    let wandSelectionOverlay = null;

    const FAVORITE_COLORS_KEY = 'imageEditorFavoriteColors';
    const defaultFavoriteColors = [
        '#DA312B', '#454035', '#FDE7C6', '#F89583', '#FFFFFF',
        '#000000', '#FFD54F', '#66BB6A', '#42A5F5', '#AB47BC'
    ];
    let favoriteColorValues = loadFavoriteColors();

    let dragStart = {
        pointerX: 0,
        pointerY: 0,
        textX: 0,
        textY: 0
    };

    function updateTextButton() {
        const hasText = textSettings.enabled && textSettings.text.trim();

        openTextBtn.textContent = hasText ? 'A) 텍스트 수정' : 'A) 텍스트 추가';
    }

    function openTextEditor() {
        const hasText = textSettings.enabled && textSettings.text.trim();

    loadLocalFontsBtn.addEventListener('click', async () => {
        if (!('queryLocalFonts' in window)) {
            alert(
                '현재 브라우저는 PC 글꼴 불러오기를 지원하지 않습니다.\n' +
                'Chrome 또는 Edge 최신 버전을 사용해주세요.'
            );
            return;
        }

        try {
            localFonts = await window.queryLocalFonts();

            fontSelect.innerHTML = '';

            const defaultOption = document.createElement('option');
            defaultOption.value = 'Arial';
            defaultOption.textContent = 'Arial';
            fontSelect.appendChild(defaultOption);

            localFonts
                .sort((a, b) =>
                    a.fullName.localeCompare(b.fullName, 'ko')
                )
                .forEach((font, index) => {
                    const option = document.createElement('option');

                    option.value = `local:${index}`;
                    option.textContent = font.fullName;

                    fontSelect.appendChild(option);
                });

            alert(`${localFonts.length}개의 설치된 글꼴을 불러왔습니다.`);

        } catch (error) {
            console.error(error);

            if (error.name === 'NotAllowedError') {
                alert('PC 글꼴 접근 권한이 허용되지 않았습니다.');
            } else {
                alert(
                    'PC 글꼴을 불러오지 못했습니다.\n\n' +
                    '이 기능은 localhost 또는 HTTPS 환경에서 실행해야 합니다.'
                );
            }
        }
    });

    fontSelect.addEventListener('change', async () => {
        const value = fontSelect.value;
        textSettings.fontOption = value;

        if (!value.startsWith('local:')) {
            textSettings.fontFamily = value;
            render();
            return;
        }

        const index = Number(value.replace('local:', ''));
        const fontData = localFonts[index];

        if (!fontData) return;

        try {
            const key = fontData.postscriptName || fontData.fullName;

            let familyName = loadedFontFaces.get(key);

            if (!familyName) {
                familyName = `LocalFont_${loadedFontFaces.size}`;

                const blob = await fontData.blob();
                const buffer = await blob.arrayBuffer();

                const fontFace = new FontFace(
                    familyName,
                    buffer
                );

                await fontFace.load();

                document.fonts.add(fontFace);

                loadedFontFaces.set(key, familyName);
            }

            textSettings.fontFamily = familyName;

            render();

        } catch (error) {
            console.error(error);
            alert('선택한 글꼴을 적용하지 못했습니다.');
        }
    });

    function clampZoom(value) {

    function updateZoomDisplay() {

            canvasStage.hidden = true;

        canvasStage.hidden = false;
        canvasStage.style.width = `${Math.max(1, Math.round(canvas.width * zoomScale))}px`;
        canvasStage.style.height = `${Math.max(1, Math.round(canvas.height * zoomScale))}px`;

    function fitCanvasToHeight() {
        if (canvas.hidden || !canvas.width || !canvas.height) return;

        const availableHeight = Math.max(previewWrap.clientHeight - 24, 50);
        const availableWidth = Math.max(previewWrap.clientWidth - 24, 50);

        const scaleHeight = availableHeight / canvas.height;
        const scaleWidth = availableWidth / canvas.width;

        const finalScale = scaleWidth < scaleHeight ? scaleWidth : scaleHeight;

        setZoom(finalScale, false);

        previewWrap.scrollTop = Math.max(0, (previewWrap.scrollHeight - previewWrap.clientHeight) / 2);
        previewWrap.scrollLeft = Math.max(0, (previewWrap.scrollWidth - previewWrap.clientWidth) / 2);
    }

    function queueFitCanvasToHeight() {

    function getWandTolerance() {
        const value = parseInt(wandTolerance.value || 0, 10);
        const safeValue = Math.max(0, Math.min(255, Number.isNaN(value) ? 0 : value));
        wandTolerance.value = safeValue;

    function updateWandControls() {
        const hasImages = imageItems.length > 0;

        wandBtn.disabled = !hasImages;

    function normalizeHex(value) {
        let hex = String(value || '').trim().replace(/^#/, '');

        if (/^[0-9a-fA-F]{3}$/.test(hex)) {
            hex = hex.split('').map(char => char + char).join('');
        }

        if (!/^[0-9a-fA-F]{6}$/.test(hex)) return null;

        return '#' + hex.toUpperCase();
    }

    function hexToRgb(hex) {
        const value = hex.replace('#', '');
        return {
            r: parseInt(value.slice(0, 2), 16),
            g: parseInt(value.slice(2, 4), 16),
            b: parseInt(value.slice(4, 6), 16)
        };
    }

    function buildWandOverlay() {
        if (!wandSelection || wandSelection.index !== currentIndex) {
            wandSelectionOverlay = null;
            return;
        }

        const overlay = document.createElement('canvas');
        overlay.width = wandSelection.width;
        overlay.height = wandSelection.height;

        const overlayCtx = overlay.getContext('2d');
        const overlayData = overlayCtx.createImageData(overlay.width, overlay.height);
        const pixels = overlayData.data;
        const mask = wandSelection.mask;

        for (let i = 0; i < mask.length; i++) {
            if (!mask[i]) continue;

            const p = i * 4;
            pixels[p] = 35;
            pixels[p + 1] = 125;
            pixels[p + 2] = 255;
            pixels[p + 3] = 90;
        }

        overlayCtx.putImageData(overlayData, 0, 0);
        wandSelectionOverlay = overlay;
    }

    function drawWandSelection(targetCtx, metrics) {
        if (
            !wandSelection ||
            !wandSelectionOverlay ||
            wandSelection.index !== currentIndex ||
            wandSelection.count <= 0
        ) {
            return;
        }

        targetCtx.save();
        targetCtx.drawImage(
            wandSelectionOverlay,
            metrics.cropLeft,
            metrics.cropTop,
            metrics.sourceWidth,
            metrics.sourceHeight,
            metrics.addLeft,
            metrics.addTop,
            metrics.sourceWidth,
            metrics.sourceHeight
        );
        targetCtx.restore();
    }

    function getWandSourcePoint(point, item) {
        const metrics = getMetrics(item.image, values);
        if (!metrics) return null;

        const x = Math.floor(point.x - metrics.addLeft + metrics.cropLeft);
        const y = Math.floor(point.y - metrics.addTop + metrics.cropTop);

        if (
            x < metrics.cropLeft ||
            y < metrics.cropTop ||
            x >= metrics.cropLeft + metrics.sourceWidth ||
            y >= metrics.cropTop + metrics.sourceHeight ||
            x < 0 ||
            y < 0 ||
            x >= item.image.naturalWidth ||
            y >= item.image.naturalHeight
        ) {
            return null;
        }

        return { x, y };
    }

    function createImageDataFromImage(img) {
        const workCanvas = document.createElement('canvas');
        workCanvas.width = img.naturalWidth;
        workCanvas.height = img.naturalHeight;

        const workCtx = workCanvas.getContext('2d', { willReadFrequently: true });
        workCtx.drawImage(img, 0, 0);

        return {
            canvas: workCanvas,
            ctx: workCtx,
            imageData: workCtx.getImageData(0, 0, workCanvas.width, workCanvas.height)
        };
    }

    function selectWandRegion(sourceX, sourceY, addToSelection) {
        const item = getCurrentItem();
        if (!item) return;

        const { imageData } = createImageDataFromImage(item.image);
        const data = imageData.data;
        const width = imageData.width;
        const height = imageData.height;
        const tolerance = getWandTolerance();
        const startIndex = sourceY * width + sourceX;
        const startPixel = startIndex * 4;

        const startR = data[startPixel];
        const startG = data[startPixel + 1];
        const startB = data[startPixel + 2];
        const startA = data[startPixel + 3];

        let mask;

        if (
            addToSelection &&
            wandSelection &&
            wandSelection.index === currentIndex &&
            wandSelection.width === width &&
            wandSelection.height === height
        ) {
            mask = wandSelection.mask.slice();
        } else {
            mask = new Uint8Array(width * height);
        }

        const visited = new Uint8Array(width * height);
        const queue = new Int32Array(width * height);
        let head = 0;
        let tail = 0;

        function matches(index) {
            const p = index * 4;
            const a = data[p + 3];

            if (startA === 0 && a === 0) return true;
            if (Math.abs(a - startA) > tolerance) return false;

            return (
                Math.abs(data[p] - startR) <= tolerance &&
                Math.abs(data[p + 1] - startG) <= tolerance &&
                Math.abs(data[p + 2] - startB) <= tolerance
            );
        }

        function add(index) {
            if (index < 0 || index >= width * height || visited[index]) return;
            if (!matches(index)) return;

            visited[index] = 1;
            queue[tail++] = index;
        }

        add(startIndex);

        while (head < tail) {
            const index = queue[head++];
            mask[index] = 1;

            const x = index % width;
            const y = Math.floor(index / width);

            if (x > 0) add(index - 1);
            if (x < width - 1) add(index + 1);
            if (y > 0) add(index - width);
            if (y < height - 1) add(index + width);

            if (x > 0 && y > 0) add(index - width - 1);
            if (x < width - 1 && y > 0) add(index - width + 1);
            if (x > 0 && y < height - 1) add(index + width - 1);
            if (x < width - 1 && y < height - 1) add(index + width + 1);
        }

        let count = 0;
        for (let i = 0; i < mask.length; i++) {
            if (mask[i]) count++;
        }

        wandSelection = {
            index: currentIndex,
            width,
            height,
            mask,
            count
        };

        buildWandOverlay();
        updateWandControls();

        wandStatus.textContent =
            `${count.toLocaleString()}px 선택됨` +
            (addToSelection ? ' · 영역 추가됨' : '') +
            ' · Shift/Ctrl + 클릭으로 더 추가 가능';

        render();
    }

    function updateResizeSummary() {
        const item = getCurrentItem();
        if (!item) return;

        const width = Math.max(
            1,

        );

    // 너비를 직접 입력하면 → 너비 기준
    resizeWidth.addEventListener('input', () => {

        resizeMode = 'width';

        const item = getCurrentItem();
        if (!item) return;

        resizeMode = 'height';

        const height = Math.max(
            1,
            parseInt(resizeHeight.value || 1, 10)
        );

        const ratio =
            item.image.naturalWidth /

        resizeWidth.value = Math.max(
            1,
            Math.round(height * ratio)
        );

        updateResizeSummary();
    });


    applyResizeBtn.addEventListener('click', async () => {
        if (!imageItems.length) return;

        const targetWidth = Math.max(
            1,
            parseInt(resizeWidth.value || 1, 10)
        );

        const targetHeight = Math.max(
            1,
            parseInt(resizeHeight.value || 1, 10)
        );

        applyResizeBtn.disabled = true;

        try {
            for (let i = 0; i < imageItems.length; i++) {
                const item = imageItems[i];
                const img = item.image;

                // 각 사진마다 자기 비율 계산
                const ratio =
                    img.naturalWidth /
                    img.naturalHeight;

                let newWidth;
                let newHeight;

                if (resizeMode === 'width') {
                    // 너비를 입력했다면
                    // 모든 이미지의 너비를 똑같이 맞춤
                    newWidth = targetWidth;

                    // 높이는 각 이미지 비율에 따라 계산
                    newHeight = Math.max(
                        1,
                        Math.round(newWidth / ratio)
                    );

                } else {
                    // 높이를 입력했다면
                    // 모든 이미지의 높이를 똑같이 맞춤
                    newHeight = targetHeight;

                    // 너비는 각 이미지 비율에 따라 계산
                    newWidth = Math.max(
                        1,
                        Math.round(newHeight * ratio)
                    );
                }

                sizeInfo.textContent =
                    `${i + 1} / ${imageItems.length} · ` +
                    `${item.fileName} · ` +
                    `${newWidth} × ${newHeight}px 조정 중...`;

                const resizeCanvas =
                    document.createElement('canvas');

                resizeCanvas.width = newWidth;
                resizeCanvas.height = newHeight;

                const resizeCtx =
                    resizeCanvas.getContext('2d');

                resizeCtx.imageSmoothingEnabled = true;
                resizeCtx.imageSmoothingQuality = 'high';

                resizeCtx.clearRect(
                    0,
                    0,
                    newWidth,
                    newHeight
                );

                resizeCtx.drawImage(
                    img,
                    0,
                    0,
                    img.naturalWidth,
                    img.naturalHeight,
                    0,
                    0,
                    newWidth,
                    newHeight
                );

                const blob =
                    await canvasToBlob(resizeCanvas);

                if (!blob) {
                    throw new Error(
                        `"${item.fileName}" 크기 조정 실패`
                    );
                }

                item.image =
                    await blobToImage(blob);
            }

            clearWandSelection(false);

            manualZoom = false;

            closeModal('resizeModal');

            render();

        } catch (error) {
            console.error(error);

            alert(
                '전체 이미지 크기 조정 중 오류가 발생했습니다.\n' +
                error.message
            );

            render();

        } finally {
            applyResizeBtn.disabled = false;
        }
    });

    function applyTextStyle(targetCtx) {
        targetCtx.font = `${textSettings.fontSize}px "${textSettings.fontFamily || 'Arial'}"`;
        targetCtx.textAlign = 'center';
        targetCtx.textBaseline = 'middle';
        targetCtx.lineJoin = 'round';
    }

    function getTextBounds(targetCtx, targetCanvas) {
        if (!textSettings.enabled || !textSettings.text.trim()) return null;

        targetCtx.save();
        applyTextStyle(targetCtx);

        const metrics = targetCtx.measureText(textSettings.text);

        const x = targetCanvas.width * (textSettings.x / 100);
        const y = targetCanvas.height * (textSettings.y / 100);

        const ascent = metrics.actualBoundingBoxAscent || textSettings.fontSize * 0.8;
        const descent = metrics.actualBoundingBoxDescent || textSettings.fontSize * 0.2;

        const padding = textSettings.outlineWidth + 8;

        const bounds = {
            left: x - metrics.width / 2 - padding,
            right: x + metrics.width / 2 + padding,
            top: y - ascent - padding,
            bottom: y + descent + padding
        };

        targetCtx.restore();

        return bounds;
    }

    function drawText(targetCtx, targetCanvas, showSelection = false) {
        if (!textSettings.enabled || !textSettings.text.trim()) return;

        const x = targetCanvas.width * (textSettings.x / 100);
        const y = targetCanvas.height * (textSettings.y / 100);

        targetCtx.save();

        applyTextStyle(targetCtx);

        if (textSettings.outlineWidth > 0) {
            targetCtx.strokeStyle = textSettings.outlineColor;
            targetCtx.lineWidth = textSettings.outlineWidth * 2;

            targetCtx.strokeText(
                textSettings.text,
                x,
                y
            );
        }

        targetCtx.fillStyle = textSettings.color;

        targetCtx.fillText(
            textSettings.text,
            x,
            y
        );

        targetCtx.restore();

        if (showSelection && textSelected) {
            const bounds = getTextBounds(targetCtx, targetCanvas);

            if (bounds) {
                targetCtx.save();

                targetCtx.strokeStyle = '#333';
                targetCtx.lineWidth = 1;
                targetCtx.setLineDash([5, 4]);

                targetCtx.strokeRect(
                    bounds.left,
                    bounds.top,
                    bounds.right - bounds.left,
                    bounds.bottom - bounds.top
                );

                targetCtx.restore();
            }
        }
    }

    [topInput, bottomInput, leftInput, rightInput].forEach(input => {
        input.addEventListener('input', updateEditSummary);
    });

    function getInputValues() {
        return {
            top: parseInt(topInput.value || 0, 10),
            bottom: parseInt(bottomInput.value || 0, 10),
            left: parseInt(leftInput.value || 0, 10),
            right: parseInt(rightInput.value || 0, 10)
        };
    }

    function getMetrics(img, v) {
        const cropLeft = Math.max(-v.left, 0);
        const cropRight = Math.max(-v.right, 0);
        const cropTop = Math.max(-v.top, 0);
        const cropBottom = Math.max(-v.bottom, 0);

        const addLeft = Math.max(v.left, 0);
        const addRight = Math.max(v.right, 0);
        const addTop = Math.max(v.top, 0);
        const addBottom = Math.max(v.bottom, 0);

        const sourceWidth = img.naturalWidth - cropLeft - cropRight;
        const sourceHeight = img.naturalHeight - cropTop - cropBottom;

        if (sourceWidth <= 0 || sourceHeight <= 0) return null;

        return {
            cropLeft,
            cropTop,
            addLeft,
            addTop,
            sourceWidth,
            sourceHeight,
            resultWidth: sourceWidth + addLeft + addRight,
            resultHeight: sourceHeight + addTop + addBottom
        };
    }

    function updateEditSummary() {
        const item = getCurrentItem();
        if (!item) return;

        const v = getInputValues();
        const metrics = getMetrics(item.image, v);

        if (!metrics) {
            editSummary.innerHTML = '<b>현재 값으로는 이미지를 만들 수 없습니다.</b>';
            return;
        }

        editSummary.innerHTML =
            `원본: <b>${item.image.naturalWidth} × ${item.image.naturalHeight}px</b><br>` +
            `결과: <b>${metrics.resultWidth} × ${metrics.resultHeight}px</b><br>` +
            `이 값은 모든 이미지에 동일하게 적용됩니다.`;
    }

    function readImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();

            reader.onload = e => {
                const img = new Image();

                img.onload = () => resolve({
                    file: file,
                    image: img,
                    originalImage: img,
                    backgroundRemoved: false,
                    fileName: file.name,
                    outputName: file.name.replace(/\.[^.]+$/, '') + '.png'
                });

                img.onerror = reject;
                img.src = e.target.result;
            };

            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    function drawImage(targetCanvas, img, v, showTextSelection = false) {
        const metrics = getMetrics(img, v);
        if (!metrics) return null;

        targetCanvas.width = metrics.resultWidth;
        targetCanvas.height = metrics.resultHeight;

        const targetCtx = targetCanvas.getContext('2d');
        targetCtx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);

        targetCtx.drawImage(
            img,
            metrics.cropLeft,
            metrics.cropTop,
            metrics.sourceWidth,
            metrics.sourceHeight,
            metrics.addLeft,
            metrics.addTop,
            metrics.sourceWidth,
            metrics.sourceHeight
        );

        drawText(targetCtx, targetCanvas, showTextSelection);

        return metrics;
    }

    function render() {
        const item = getCurrentItem();
        if (!item) {
            canvas.hidden = true;
            canvasStage.hidden = true;
            emptyText.hidden = false;
            updateZoomDisplay();
            return;
        }

        const metrics = drawImage(canvas, item.image, values, true);

        if (metrics) {
            drawWandSelection(ctx, metrics);
        }

        if (!metrics) {
            canvas.hidden = true;
            canvasStage.hidden = true;
            emptyText.hidden = false;
            emptyText.textContent = '현재 편집값을 이 이미지에 적용할 수 없습니다.';
            updateZoomDisplay();
            return;

        canvas.hidden = false;
        emptyText.hidden = true;

        sizeInfo.textContent =

            `원본 ${item.image.naturalWidth} × ${item.image.naturalHeight}px → ` +

    function getCanvasPoint(event) {
        const rect = canvas.getBoundingClientRect();

        return {
            x: (event.clientX - rect.left) * (canvas.width / rect.width),
            y: (event.clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    function isPointOnText(point) {
        if (!textSettings.enabled || !textSettings.text.trim()) return false;

        const bounds = getTextBounds(ctx, canvas);
        if (!bounds) return false;

        return (
            point.x >= bounds.left &&
            point.x <= bounds.right &&
            point.y >= bounds.top &&
            point.y <= bounds.bottom
        );
    }

    canvas.addEventListener('pointerdown', event => {
        if (event.button === 2) return;

        if (wandMode) {
            event.preventDefault();

            const item = getCurrentItem();
            if (!item) return;

            const point = getCanvasPoint(event);
            const sourcePoint = getWandSourcePoint(point, item);

            if (!sourcePoint) {
                wandStatus.textContent = '이미지 영역 안쪽을 클릭해주세요.';
                return;
            }

            selectWandRegion(
                sourcePoint.x,
                sourcePoint.y,
                event.shiftKey || event.ctrlKey
            );
            return;
        }

        if (!textSettings.enabled || !textSettings.text.trim()) return;

        const point = getCanvasPoint(event);

        if (!isPointOnText(point)) {
            textSelected = false;
            render();
            return;
        }

        event.preventDefault();

        textSelected = true;
        draggingText = true;
        dragAxis = null;

        dragStart.pointerX = point.x;
        dragStart.pointerY = point.y;

        dragStart.textX = canvas.width * (textSettings.x / 100);
        dragStart.textY = canvas.height * (textSettings.y / 100);

        canvas.setPointerCapture(event.pointerId);
        canvas.style.cursor = 'grabbing';

        render();
    });

    canvas.addEventListener('pointermove', event => {
        const point = getCanvasPoint(event);

        if (wandMode && !draggingText) {
            canvas.style.cursor = 'crosshair';
            return;
        }

        if (!draggingText) {
            canvas.style.cursor = isPointOnText(point) ? 'move' : 'default';
            return;
        }

        event.preventDefault();

        let dx = point.x - dragStart.pointerX;
        let dy = point.y - dragStart.pointerY;

        const straightMode = event.shiftKey || event.ctrlKey;

        if (straightMode) {
            if (!dragAxis && (Math.abs(dx) > 2 || Math.abs(dy) > 2)) {
                dragAxis = Math.abs(dx) >= Math.abs(dy) ? 'x' : 'y';
            }

            if (dragAxis === 'x') {
                dy = 0;
            }

            if (dragAxis === 'y') {
                dx = 0;
            }
        } else {
            dragAxis = null;
        }

        let newX = dragStart.textX + dx;
        let newY = dragStart.textY + dy;

        newX = Math.max(0, Math.min(canvas.width, newX));
        newY = Math.max(0, Math.min(canvas.height, newY));

        textSettings.x = (newX / canvas.width) * 100;
        textSettings.y = (newY / canvas.height) * 100;

        render();
    });

    function stopTextDrag(event) {
        if (!draggingText) return;

        draggingText = false;
        dragAxis = null;

        if (canvas.hasPointerCapture(event.pointerId)) {
            canvas.releasePointerCapture(event.pointerId);
        }

        canvas.style.cursor = 'move';

        textX.value = textSettings.x.toFixed(2);
        textY.value = textSettings.y.toFixed(2);

        render();
    }

    async function applySelectedColor(forcedHex = null) {
        const item = getCurrentItem();

        if (
            !item ||
            !wandSelection ||
            wandSelection.index !== currentIndex ||
            wandSelection.count <= 0
        ) {
            return;
        }

        applyWandColorBtn.disabled = true;

        try {
            const { canvas: workCanvas, ctx: workCtx, imageData } =
                createImageDataFromImage(item.image);

            const data = imageData.data;
            const mask = wandSelection.mask;
            const normalizedHex =
                normalizeHex(forcedHex) ||
                normalizeHex(wandHex.value) ||
                normalizeHex(wandColor.value) ||
                '#000000';

            setWandColorValue(normalizedHex);

            const color = hexToRgb(normalizedHex);

            for (let i = 0; i < mask.length; i++) {
                if (!mask[i]) continue;

                const p = i * 4;
                data[p] = color.r;
                data[p + 1] = color.g;
                data[p + 2] = color.b;
            }

            workCtx.putImageData(imageData, 0, 0);

            const blob = await canvasToBlob(workCanvas);
            if (!blob) throw new Error('색상 변경 이미지를 만들지 못했습니다.');

            item.image = await blobToImage(blob);

            buildWandOverlay();
            wandStatus.textContent =
                `${wandSelection.count.toLocaleString()}px 영역의 색상을 ${wandHex.value}로 변경했습니다.`;

            render();
        } catch (error) {
            console.error(error);
            alert('선택 영역 색상 변경 중 오류가 발생했습니다.\n' + error.message);
        } finally {
            updateWandControls();
        }
    }

    window.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            document.querySelectorAll('.modal-backdrop.show').forEach(modal => {
                closeModal(modal.id);
            });

            textSelected = false;

            if (wandMode || wandSelection) {
                wandMode = false;
                clearWandSelection(false);
                canvas.style.cursor = 'default';
                updateWandControls();
            }

            if (imageItems.length) render();
            return;
        }

        const activeTag = document.activeElement?.tagName;

        if (
            activeTag === 'INPUT' ||
            activeTag === 'TEXTAREA' ||
            activeTag === 'SELECT'
        ) {
            return;
        }

        const key = e.key.toLowerCase();

        // Ctrl 단축키
        if (e.ctrlKey && !e.shiftKey && !e.altKey && imageItems.length) {
            if (key === 'q') {
                e.preventDefault();
                if (!openEditBtn.disabled) openEditBtn.click();
                return;
            }

            if (key === 'w') {
                e.preventDefault();
                if (!openResizeBtn.disabled) openResizeBtn.click();
                return;
            }

            if (key === 'a') {
                e.preventDefault();
                if (!openTextBtn.disabled) openTextBtn.click();
                return;
            }

            if (key === 's') {
                e.preventDefault();
                if (!resetBtn.disabled) resetBtn.click();
                return;
            }

            if (key === 'z') {
                e.preventDefault();
                if (!removeAllBgBtn.disabled) removeAllBgBtn.click();
                return;
            }

            if (key === 'x') {
                e.preventDefault();
                if (!wandBtn.disabled) wandBtn.click();
                return;
            }
        }

        // 즐겨찾기 색상 단축키: 1~9, 0
        if (!e.ctrlKey && !e.altKey && !e.metaKey && /^[0-9]$/.test(e.key) && imageItems.length) {
            const index = e.key === '0' ? 9 : Number(e.key) - 1;
            const color = favoriteColorValues[index];

            if (color) {
                e.preventDefault();
                setWandColorValue(color);

                if (
                    wandSelection &&
                    wandSelection.index === currentIndex &&
                    wandSelection.count > 0
                ) {
                    applySelectedColor(color);
                } else {
                    wandStatus.textContent =
                        `${color} 색상이 선택되었습니다. 마법봉으로 영역을 먼저 선택해주세요.`;
                    updateWandControls();
                }
            }

            return;
        }

        // 현재 이미지 저장: S
        // 전체 이미지 저장: Shift + S
        if (!e.ctrlKey && !e.altKey && !e.metaKey && key === 's' && imageItems.length) {
            e.preventDefault();

            if (e.shiftKey) {
                if (!saveAllBtn.disabled) saveAllBtn.click();
            } else {
                if (!saveBtn.disabled) saveBtn.click();
            }

            return;
        }

        // 이미지 이동
        if (imageItems.length > 1) {
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                goToPrevImage();
                return;
            }

            if (e.key === 'ArrowRight') {
                e.preventDefault();
                goToNextImage();
                return;
            }
        }

        if (
            textSelected &&
            (e.key === 'Delete' || e.key === 'Backspace')
        ) {
            e.preventDefault();
            removeText();
        }
    });

    function downloadBlob(blob, fileName) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');

        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function canvasToBlob(targetCanvas) {
        return new Promise(resolve => targetCanvas.toBlob(resolve, 'image/png'));
    }

    saveBtn.addEventListener('click', async () => {
        const item = getCurrentItem();
        if (!item) return;

        const resultCanvas = document.createElement('canvas');

        if (!drawImage(resultCanvas, item.image, values)) return;

        const blob = await canvasToBlob(resultCanvas);
        if (blob) downloadBlob(blob, item.outputName);
    });

    let removeBackgroundFn = null;

    function blobToImage(blob) {
        return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(blob);
            const img = new Image();

            img.onload = () => {
                URL.revokeObjectURL(url);
                resolve(img);
            };

            img.onerror = () => {
                URL.revokeObjectURL(url);
                reject(new Error('배경제거 결과 이미지를 불러오지 못했습니다.'));
            };

            img.src = url;
        });
    }

    async function removeItemBackground(item, progressText) {
        sizeInfo.textContent = `${progressText} · 배경 제거 중...`;

        const img = item.originalImage;

        const workCanvas = document.createElement('canvas');
        workCanvas.width = img.naturalWidth;
        workCanvas.height = img.naturalHeight;

        const workCtx = workCanvas.getContext('2d', { willReadFrequently: true });
        workCtx.drawImage(img, 0, 0);

        const imageData = workCtx.getImageData(
            0,
            0,
            workCanvas.width,
            workCanvas.height
        );

        const data = imageData.data;
        const width = workCanvas.width;
        const height = workCanvas.height;

        /*
         * 네 이미지처럼 배경이 흰색/밝은색인 경우를 기준으로
         * 이미지 네 모서리에서 실제 배경색을 구한다.
         */
        function getBackgroundColor() {
            const samples = [];
            const sampleSize = Math.max(
                2,
                Math.min(10, Math.floor(Math.min(width, height) * 0.03))
            );

            function collect(startX, startY) {
                for (let y = startY; y < startY + sampleSize; y++) {
                    for (let x = startX; x < startX + sampleSize; x++) {
                        const i = (y * width + x) * 4;

                        if (data[i + 3] === 0) continue;

                        samples.push([
                            data[i],
                            data[i + 1],
                            data[i + 2]
                        ]);
                    }
                }
            }

            collect(0, 0);
            collect(width - sampleSize, 0);
            collect(0, height - sampleSize);
            collect(width - sampleSize, height - sampleSize);

            if (!samples.length) {
                return { r: 255, g: 255, b: 255 };
            }

            samples.sort((a, b) =>
                (a[0] + a[1] + a[2]) -
                (b[0] + b[1] + b[2])
            );

            const middle = samples[Math.floor(samples.length / 2)];

            return {
                r: middle[0],
                g: middle[1],
                b: middle[2]
            };
        }

        const bg = getBackgroundColor();

        const visited = new Uint8Array(width * height);
        const queue = [];

        /*
         * 작을수록 배경과 거의 동일
         * 클수록 캐릭터 색에 가까움
         */
        const FULL_REMOVE_DISTANCE = 18;
        const EDGE_DISTANCE = 75;

        function colorDistance(index) {
            const i = index * 4;

            const dr = data[i] - bg.r;
            const dg = data[i + 1] - bg.g;
            const db = data[i + 2] - bg.b;

            return Math.sqrt(
                dr * dr +
                dg * dg +
                db * db
            );
        }

        function canBeBackground(x, y) {
            const index = y * width + x;
            const i = index * 4;

            if (data[i + 3] === 0) return true;

            return colorDistance(index) <= EDGE_DISTANCE;
        }

        function add(x, y) {
            if (
                x < 0 ||
                y < 0 ||
                x >= width ||
                y >= height
            ) {
                return;
            }

            const index = y * width + x;

            if (visited[index]) return;
            if (!canBeBackground(x, y)) return;

            visited[index] = 1;
            queue.push(index);
        }

        // 바깥쪽에서만 배경 탐색
        for (let x = 0; x < width; x++) {
            add(x, 0);
            add(x, height - 1);
        }

        for (let y = 0; y < height; y++) {
            add(0, y);
            add(width - 1, y);
        }

        let head = 0;

        while (head < queue.length) {
            const index = queue[head++];
            const i = index * 4;

            const x = index % width;
            const y = Math.floor(index / width);

            const originalAlpha = data[i + 3];

            // 원래 투명이면 계속 투명
            if (originalAlpha === 0) {
                addNeighbours(x, y);
                continue;
            }

            const distance = colorDistance(index);

            let alpha;

            if (distance <= FULL_REMOVE_DISTANCE) {
                alpha = 0;
            } else {
                alpha =
                    (distance - FULL_REMOVE_DISTANCE) /
                    (EDGE_DISTANCE - FULL_REMOVE_DISTANCE);

                alpha = Math.max(0, Math.min(1, alpha));
            }

            /*
             * 핵심:
             * 단순히 Alpha만 바꾸지 않고
             * 배경색이 섞인 RGB도 제거한다.
             */
            if (alpha > 0.01 && alpha < 1) {
                const inverseAlpha = 1 - alpha;

                data[i] = Math.round(
                    Math.max(
                        0,
                        Math.min(
                            255,
                            (data[i] - bg.r * inverseAlpha) / alpha
                        )
                    )
                );

                data[i + 1] = Math.round(
                    Math.max(
                        0,
                        Math.min(
                            255,
                            (data[i + 1] - bg.g * inverseAlpha) / alpha
                        )
                    )
                );

                data[i + 2] = Math.round(
                    Math.max(
                        0,
                        Math.min(
                            255,
                            (data[i + 2] - bg.b * inverseAlpha) / alpha
                        )
                    )
                );
            }

            data[i + 3] = Math.round(
                alpha * originalAlpha
            );

            addNeighbours(x, y);
        }

        function addNeighbours(x, y) {
            add(x - 1, y - 1);
            add(x,     y - 1);
            add(x + 1, y - 1);

            add(x - 1, y);
            add(x + 1, y);

            add(x - 1, y + 1);
            add(x,     y + 1);
            add(x + 1, y + 1);
        }

        workCtx.putImageData(imageData, 0, 0);

        const blob = await canvasToBlob(workCanvas);

        item.image = await blobToImage(blob);
        item.backgroundRemoved = true;

        sizeInfo.textContent = `${item.fileName} · 배경 제거 완료`;
    }

    removeAllBgBtn.addEventListener('click', async () => {
        if (!imageItems.length) return;

        removeAllBgBtn.disabled = true;

        try {
            for (let i = 0; i < imageItems.length; i++) {
                const item = imageItems[i];

                if (item.backgroundRemoved) continue;

                sizeInfo.textContent =
                    `${i + 1} / ${imageItems.length} · ${item.fileName} · 배경 제거 중...`;

                await removeItemBackground(
                    item,
                    `${i + 1} / ${imageItems.length} · ${item.fileName}`
                );

                if (i === currentIndex) render();
            }
            showCheckerBackground();
            render();
        } catch (error) {
            console.error(error);
            alert('전체 배경 제거 중 오류가 발생했습니다.\n' + error.message);
            render();
        } finally {
            removeAllBgBtn.disabled = false;
        }
    });

    saveAllBtn.addEventListener('click', async () => {
        if (!imageItems.length) return;

        for (const item of imageItems) {
            const resultCanvas = document.createElement('canvas');

            if (!drawImage(resultCanvas, item.image, values)) continue;

            const blob = await canvasToBlob(resultCanvas);

            if (blob) {
                downloadBlob(blob, item.outputName);
                await new Promise(resolve => setTimeout(resolve, 150));
            }
        }
    });

    window.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            document.querySelectorAll('.modal-backdrop.show').forEach(modal => {
                closeModal(modal.id);
            });
        }
    });

    const CHECKER_BACKGROUND_IMAGE = `
        linear-gradient(45deg, #ddd 25%, transparent 25%),
        linear-gradient(-45deg, #ddd 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ddd 75%),
        linear-gradient(-45deg, transparent 75%, #ddd 75%)
    `;

    function showCheckerBackground() {
        previewWrap.style.backgroundColor = '#ffffff';
        previewWrap.style.backgroundImage = CHECKER_BACKGROUND_IMAGE;
        previewWrap.style.backgroundSize = '20px 20px';
        previewWrap.style.backgroundPosition =
            '0 0, 0 10px, 10px -10px, -10px 0';
    }

    function showSolidBackground(color) {
        previewWrap.style.backgroundColor = color;
        previewWrap.style.backgroundImage = 'none';
    }

    previewBgColor.addEventListener('input', () => {
        showSolidBackground(previewBgColor.value);
    });

    checkerBgBtn.addEventListener('click', showCheckerBackground);

    // 최초 상태
    showCheckerBackground();
    updateImageNavigation();
    renderFavoriteButtons();
    updateWandControls();
</script>
</body>
</html>
